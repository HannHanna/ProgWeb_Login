<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4 border-0 rounded-4" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-purple text-uppercase">INICIAR SESIÓN</h3>
            <p class="text-muted small text-uppercase">INGRESE SUS CREDENCIALES PARA CONTINUAR</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label for="correo" class="form-label text-uppercase fw-semibold small">CORREO ELECTRÓNICO</label>
                <input type="email" class="form-control" id="correo" required placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label text-uppercase fw-semibold small">CONTRASEÑA</label>
                <input type="password" class="form-control" id="password" required placeholder="••••••••">
            </div>
            <div id="errorMsg" class="text-danger small mb-3 d-none text-uppercase"></div>
            <button type="submit" class="btn btn-purple w-100 text-white fw-semibold text-uppercase">INGRESAR</button>
        </form>
    </div>

    <!-- Script de utilería y login -->
    <script src="https://cdn.jsdelivr.net/gh/HannHanna/ProgWeb_Utileria@v1.0.0/js/utileria.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
